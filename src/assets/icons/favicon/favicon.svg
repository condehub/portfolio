<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <linearGradient id="techRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1744" />
      <stop offset="100%" stop-color="#D50000" />
    </linearGradient>
  </defs>
  <g transform="translate(0, 60)">
    <!-- Seta Esquerda (<) -->
    <path d="M 47,35 L 22,60 L 47,85"
          stroke="#0F172A" stroke-width="12"
          stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Losango Central -->
    <polygon points="92,24 118,60 92,96 66,60"
             fill="url(#techRed)" stroke="url(#techRed)"
             stroke-width="8" stroke-linejoin="round" />
    <!-- Barra (/) -->
    <path d="M 133,95 L 163,25"
          stroke="#0F172A" stroke-width="12"
          stroke-linecap="round" fill="none" />
    <!-- Seta Direita (>) -->
    <path d="M 193,35 L 218,60 L 193,85"
          stroke="#0F172A" stroke-width="12"
          stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
